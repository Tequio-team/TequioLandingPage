<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" width="150" height="200">
  <defs>
    <linearGradient id="tochtliAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <g class="tochtli-body">
    <!-- Left ear with Mitla pattern -->
    <g class="tochtli-ear-left">
      <path d="M50 60 Q45 15 55 10 Q60 8 62 15 Q68 55 65 60" fill="url(#tochtliAmber)" opacity="0.9"/>
      <!-- Mitla greca on ear -->
      <rect x="52" y="22" width="8" height="4" fill="#1a2332" opacity="0.4" rx="1"/>
      <rect x="54" y="28" width="6" height="3" fill="#1a2332" opacity="0.4" rx="1"/>
      <rect x="52" y="33" width="8" height="4" fill="#1a2332" opacity="0.4" rx="1"/>
    </g>
    <!-- Right ear with Mitla pattern -->
    <g class="tochtli-ear-right">
      <path d="M85 60 Q82 55 88 15 Q90 8 95 10 Q105 15 100 60" fill="url(#tochtliAmber)" opacity="0.9"/>
      <rect x="90" y="22" width="8" height="4" fill="#1a2332" opacity="0.4" rx="1"/>
      <rect x="90" y="28" width="6" height="3" fill="#1a2332" opacity="0.4" rx="1"/>
      <rect x="90" y="33" width="8" height="4" fill="#1a2332" opacity="0.4" rx="1"/>
    </g>
    <!-- Head -->
    <ellipse cx="75" cy="72" rx="28" ry="24" fill="url(#tochtliAmber)"/>
    <!-- Eyes -->
    <circle cx="65" cy="68" r="4" fill="#1a2332"/>
    <circle cx="85" cy="68" r="4" fill="#1a2332"/>
    <circle cx="66" cy="67" r="1.5" fill="#f7f5f0"/>
    <circle cx="86" cy="67" r="1.5" fill="#f7f5f0"/>
    <!-- Lunar freckles -->
    <circle class="freckle" cx="58" cy="76" r="2" fill="#fcd34d" opacity="0.7"/>
    <circle class="freckle" cx="62" cy="79" r="1.5" fill="#fcd34d" opacity="0.5"/>
    <circle class="freckle" cx="88" cy="76" r="2" fill="#fcd34d" opacity="0.7"/>
    <circle class="freckle" cx="92" cy="79" r="1.5" fill="#fcd34d" opacity="0.5"/>
    <!-- Nose -->
    <ellipse cx="75" cy="77" rx="3" ry="2" fill="#c2410c" opacity="0.6"/>
    <!-- Smile -->
    <path d="M68 82 Q75 88 82 82" fill="none" stroke="#1a2332" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Body / vest -->
    <path d="M52 92 Q50 95 48 130 Q48 145 75 148 Q102 145 102 130 Q100 95 98 92 Q90 88 75 88 Q60 88 52 92" fill="#1a2332"/>
    <!-- Vest amber trim -->
    <path d="M58 92 L58 130" stroke="url(#tochtliAmber)" stroke-width="2" opacity="0.6"/>
    <path d="M92 92 L92 130" stroke="url(#tochtliAmber)" stroke-width="2" opacity="0.6"/>
    <!-- Vest collar -->
    <path d="M58 92 Q75 98 92 92" fill="none" stroke="url(#tochtliAmber)" stroke-width="2"/>
    <!-- Left arm extended (welcoming gesture) -->
    <g class="tochtli-hand">
      <path d="M48 105 Q35 100 25 95 Q22 94 20 97 Q18 100 25 108 Q32 115 45 115" fill="url(#tochtliAmber)" opacity="0.85"/>
      <!-- Fingers -->
      <circle cx="20" cy="97" r="3" fill="url(#tochtliAmber)" opacity="0.85"/>
    </g>
    <!-- Right arm with chisel -->
    <path d="M102 105 Q110 100 115 105 Q118 110 112 115 Q108 115 102 112" fill="url(#tochtliAmber)" opacity="0.85"/>
    <!-- Chisel -->
    <rect x="113" y="98" width="3" height="20" rx="1" fill="#6b7280" transform="rotate(15 114 108)"/>
    <!-- Feet -->
    <ellipse cx="62" cy="152" rx="12" ry="6" fill="url(#tochtliAmber)" opacity="0.8"/>
    <ellipse cx="88" cy="152" rx="12" ry="6" fill="url(#tochtliAmber)" opacity="0.8"/>
  </g>
</svg>
